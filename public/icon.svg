<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#27272a" stroke-width="4"/>

  <!-- Booth / Camera body -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Main Shell -->
    <rect x="0" y="40" width="384" height="280" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
    
    <!-- Flash Bar -->
    <rect x="40" y="8" width="100" height="20" rx="6" fill="#27272a" stroke="#52525b" stroke-width="3"/>
    <circle cx="280" cy="18" r="10" fill="#27272a" stroke="#52525b" stroke-width="3"/>

    <!-- Lens Outer Ring -->
    <circle cx="192" cy="180" r="92" fill="#09090b" stroke="#3f3f46" stroke-width="8"/>
    <!-- Lens Glass -->
    <circle cx="192" cy="180" r="68" fill="#18181b" stroke="#27272a" stroke-width="4"/>
    <circle cx="170" cy="158" r="22" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="192" cy="180" r="32" fill="#09090b" stroke="#52525b" stroke-width="2"/>
    <circle cx="202" cy="190" r="6" fill="#ffffff" fill-opacity="0.25"/>

    <!-- Photostrip eject slot & printed photo strip hanging out -->
    <rect x="112" y="300" width="160" height="12" rx="4" fill="#09090b"/>
    <g transform="translate(132, 290)">
      <rect x="0" y="10" width="120" height="106" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="2" filter="url(#shadow)"/>
      <rect x="12" y="22" width="44" height="38" rx="3" fill="#27272a"/>
      <rect x="64" y="22" width="44" height="38" rx="3" fill="#3f3f46"/>
      <rect x="12" y="66" width="44" height="36" rx="3" fill="#52525b"/>
      <rect x="64" y="66" width="44" height="36" rx="3" fill="#18181b"/>
    </g>
  </g>
</svg>
